<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="wireframeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="60" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 34.64 M 0 0 L 60 34.64" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: url(#textGrad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e2e8f0;
    }

    /* Ambient Pulsing Glow Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.75; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.2) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes floatMesh {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(0.8deg); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -120; }
    }
    @keyframes scanWave {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(40px); opacity: 0.6; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }

    .orb-anim1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 250px 180px; }
    .orb-anim2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 950px 220px; }
    .mesh-floating { animation: floatMesh 6s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8 6; animation: dashCycle 4s linear infinite; }
    .scan-line { animation: scanWave 5s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Iso Grid -->
  <rect width="1200" height="420" fill="url(#isoGrid)" />

  <!-- Ambient Glowing Dynamic Orbs (Positioned safely behind content) -->
  <circle class="orb-anim1" cx="220" cy="140" r="170" fill="url(#glowGrad1)" filter="url(#glowFilter)" />
  <circle class="orb-anim2" cx="980" cy="240" r="190" fill="url(#glowGrad2)" filter="url(#glowFilter)" />
  <circle cx="600" cy="380" r="150" fill="url(#glowGrad1)" opacity="0.3" filter="url(#glowFilter)" />

  <!-- Procedural Geometry Dynamic Wireframe / Mesh Graphic (Isometric Right Section) -->
  <g class="mesh-floating" transform="translate(860, 90)">
    <!-- Procedural 3D Isometric Tower / Cube Polyhedral Stack -->
    <!-- Cube 1 Base -->
    <path d="M 120 180 L 190 220 L 190 280 L 120 240 Z" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.8" />
    <path d="M 120 180 L 50 220 L 50 280 L 120 240 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    <path d="M 120 180 L 190 220 L 120 260 L 50 220 Z" fill="#312e81" stroke="#818cf8" stroke-width="1.5" opacity="0.9" />

    <!-- Cube 2 (Stacked Elevated) -->
    <path d="M 120 100 L 180 135 L 180 190 L 120 155 Z" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" opacity="0.85" />
    <path d="M 120 100 L 60 135 L 60 190 L 120 155 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.85" />
    <path d="M 120 100 L 180 135 L 120 170 L 60 135 Z" fill="#4338ca" stroke="#c084fc" stroke-width="1.5" opacity="0.9" />

    <!-- Procedural Floating Polyhedron / Crystal Top -->
    <polygon points="120,20 155,65 120,85 85,65" fill="#4f46e5" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <polygon points="120,20 155,65 120,40" fill="#38bdf8" opacity="0.75" />
    <polygon points="120,20 85,65 120,40" fill="#818cf8" opacity="0.85" />

    <!-- Wave Function Collapse / Grid Connectivity Splines -->
    <path class="stream-line" d="M 120 85 L 120 100" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 180 160 L 230 190 L 230 250" stroke="#a855f7" stroke-width="1.5" />
    <path class="stream-line" d="M 60 160 L 10 190 L 10 240" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Floating Node Particles -->
    <circle cx="230" cy="190" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="10" cy="190" r="4" fill="#a855f7" filter="url(#softGlow)" />
    <circle cx="120" cy="20" r="5" fill="#f43f5e" filter="url(#softGlow)" />
  </g>

  <!-- Left Side Algorithmic Wireframe Grid Lines (Procedural Terrain Terrain Splines) -->
  <g opacity="0.5" transform="translate(60, 260)">
    <path d="M 0 60 Q 90 10, 180 50 T 360 40 T 540 65" fill="none" stroke="url(#wireframeGrad)" stroke-width="2" />
    <path class="scan-line" d="M 0 85 Q 90 35, 180 75 T 360 65 T 540 90" fill="none" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 0 110 Q 90 60, 180 100 T 360 90 T 540 115" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Foreground Content: Foreground Title, Subtitle, and Feature Badges (Always clear & unobstructed) -->
  <g transform="translate(80, 115)">
    <!-- Accent Pill -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.9" />
      <circle cx="14" cy="14" r="5" fill="#10b981" filter="url(#softGlow)" />
      <text x="28" y="18" class="badge-pill">PROCEDURAL 3D &amp; WEBGL ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title-text">Awesome 3D Procedural</text>
    <text x="0" y="128" class="title-text">Generation &amp; WebGL</text>

    <!-- Subtitle Description -->
    <text x="0" y="172" class="subtitle-text">Curated guide to SaaS suites, real-time WebGL/WebGPU engines, WFC,</text>
    <text x="0" y="198" class="subtitle-text">parametric CAD, and procedural geometry algorithms.</text>

    <!-- Interactive / Feature Highlights Bar -->
    <g transform="translate(0, 222)">
      <!-- Pill 1: WebGL / WebGPU -->
      <rect x="0" y="0" width="115" height="30" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="14" y="19" class="badge-pill" fill="#93c5fd">⚡ WebGL / WebGPU</text>

      <!-- Pill 2: Wave Function Collapse -->
      <rect x="125" y="0" width="168" height="30" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="137" y="19" class="badge-pill" fill="#c4b5fd">🎲 Wave Function Collapse</text>

      <!-- Pill 3: Geometry Nodes -->
      <rect x="303" y="0" width="135" height="30" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="315" y="19" class="badge-pill" fill="#fbcfe8">🔷 Geometry Nodes</text>

      <!-- Pill 4: Parametric CAD -->
      <rect x="448" y="0" width="135" height="30" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="460" y="19" class="badge-pill" fill="#6ee7b7">📐 Parametric CAD</text>
    </g>
  </g>
</svg>
